        class Car {
            constructor(brand, color, speed, power) {
                this.brand = brand
                this.color = color
                this.speed = speed 
                this.power = power 
            }

            // Encapsulation
            canSpeed(){
                console.log(`${this.brand} can speed on ${this.speed}`);
                
            }
        }

        const carOne = new Car("Tesla", "Black", "1000km", "Solar")
        const carTwo = new Car("Toyota", "White", "200km", "Petrol")

        console.log(carOne);
        console.log(carTwo);
        carOne.canSpeed()
        carTwo.canSpeed()

        // Abstraction
        class Bankaccount {
            #balance = 0;
            constructor(name, age){
                this.name = name 
                this.age = age
            }

            deposit(amount){
                console.log(`Your balance is $${this.#balance += amount}`);
                
            }

            withdraw(amount){
                console.log(`Your balance is $${this.#balance -= amount}`);
                
            }
        }

        const user1 = new Bankaccount();
        user1.deposit(1000);
        user1.deposit(1000);
        user1.withdraw(1000);



        // Polymorphism - Poly means many while morphism - means forms 

        class Human {
            constructor(name, age, gender){
                this.name = name
                this.age = age 
                this.gender = gender 
            }
            thinkingLevel(){
                console.log(`High level thinking`);
                
            }
        }

        class Lowperson extends Human{

            }
        }

        const personOne = new Human("Tope", "12", "Male")

        console.log(personOne);
