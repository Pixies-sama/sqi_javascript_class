<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FireBase</title>
</head>
<body>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 25px 8%;
            text-align: center;
        }

        header h1 {
            font-size: 35px;
            margin-bottom: 8px;
        }

        header p {
            color: #bbb;
        }

        #display {
            width: 90%;
            max-width: 1400px;
            margin: 40px auto;
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
        }

        .image-container {
    width: 50%;
    height: 230px;
    overflow: hidden;
    background: #f1f5f9;
    border-radius: 14px 14px 0 0;
}

.img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
}

.product-card {
    background: #ffffff;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid #e5e7eb;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    height: 100%;
}

.product-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
}

.product-card:hover .img {
    transform: scale(1.06);
}

.product-content {
    padding: 22px;
}

.product-content .card-title:first-child {
    font-size: 21px;
    font-weight: 700;
    color: #1e293b;
    line-height: 1.4;
    margin-bottom: 10px;
    overflow-wrap: anywhere;
}

.product-content h4.card-title {
    font-size: 14px;
    font-weight: 500;
    color: #64748b;
    margin-bottom: 16px;
}

.description {
    font-size: 14px;
    line-height: 1.8;
    color: #475569;
    margin-bottom: 0;
    overflow-wrap: anywhere;
}

/* Responsive design */
@media (max-width: 768px) {
    .image-container {
        height: 200px;
    }

    .product-content {
        padding: 18px;
    }

    .product-content .card-title:first-child {
        font-size: 18px;
    }
}

@media (max-width: 480px) {
    .image-container {
        height: 180px;
    }

    .product-content {
        padding: 15px;
    }
}
        @media (max-width: 600px) {
            header h1 {
                font-size: 27px;
            }

            #display {
                width: 92%;
                grid-template-columns: 1fr;
            }
        }
    
form {
    max-width: 550px;
    margin: 50px auto !important;
    padding: 35px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    border: 1px solid #e9ecef;
}

form .form-label {
    font-weight: 600;
    color: #212529;
    margin-bottom: 8px;
    font-size: 15px;
}

form .form-control,
form .form-select {
    padding: 12px 14px;
    border: 1px solid #ced4da;
    border-radius: 9px;
    font-size: 14px;
    background-color: #f8f9fa;
    transition: all 0.3s ease;
}

form .form-control:focus,
form .form-select:focus {
    background-color: #ffffff;
    border-color: #0d6efd;
    box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.12);
    outline: none;
}

form .form-control::placeholder {
    color: #9ca3af;
    font-size: 13px;
}

form .mb-3 {
    margin-bottom: 22px !important;
}

form .form-select {
    margin-top: 5px;
    cursor: pointer;
    min-height: 45px;
}

form #submitBtn {
    width: 100%;
    margin-top: 30px;
    padding: 12px;
    border: none;
    border-radius: 9px;
    background: linear-gradient(135deg, #0d6efd, #084298);
    color: #ffffff;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.3px;
    transition: all 0.3s ease;
}

form #submitBtn:hover {
    background: linear-gradient(135deg, #084298, #052c65);
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(13, 110, 253, 0.25);
}

form #submitBtn:active {
    transform: translateY(0);
}

@media (max-width: 768px) {
    form {
        width: 90% !important;
        max-width: none;
        padding: 25px 20px;
        margin: 30px auto !important;
    }
}

    </style>
    <form class="m-auto w-50">
  <div class="mb-3 " >
    <label for="titleInput" class="form-label">Title</label>
    <input type="text" class="form-control" id="titleInput" aria-describedby="emailHelp" placeholder="Data Analysis">
    <!-- <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div> -->
  </div>
  <div class="mb-3">
    <label for="authorInput" class="form-label">Author</label>
    <input type="text" class="form-control" id="authorInput" placeholder="Omoloye Hassan">
  </div>
  <div class="mb-3">
    <label for="contentInput" class="form-label">Content</label>
    <input type="text" class="form-control" id="contentInput" placeholder="Lorem ipsum dolor adipisicing elit...">
  </div>
  <div class="mb-3">
    <label for="imageInput" class="form-label">Image</label>
    <input type="text" class="form-control" id="imageInput" placeholder="https://...">
  </div>
  <select class="form-select form-select-sm" aria-label="Small select example" id="published">
  <option selected>Open this select menu</option>
  <option value="true">True</option>
  <option value="false">False</option>
</select>
  <button type="button" class="btn btn-primary mt-3" id="submitBtn" >Submit</button>
</form>

    <div id="display"></div>
    

    <script type="module">
        // 6th october 
        let display = document.getElementById('display')
        // Firebase is a backend as a service 
        // different services 
        // 1. Fire store 
        // 2. 

        // Import the functions you need from the SDKs you need
            import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

            import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

           

            // Your web app's Firebase configuration
            const firebaseConfig = {
                apiKey: "AIzaSyDsQiD3pQat2KX9uRqXqw-Num6HHhUXvnA",
                authDomain: "hassan-blog-2d685.firebaseapp.com",
                projectId: "hassan-blog-2d685",
                storageBucket: "hassan-blog-2d685.firebasestorage.app",
                messagingSenderId: "513061618900",
                appId: "1:513061618900:web:b2d8247b62126c82932741"
            };

            // Initialize Firebase
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app)
            const colRef = collection(db, "myblog");


            let  titleInput = document.getElementById("titleInput")
            let  authorInput = document.getElementById("authorInput")
            let  contentInput = document.getElementById("contentInput")
            let  imageInput = document.getElementById("imageInput")
            let submitBtn = document.getElementById('submitBtn')
            let published = document.getElementById('published')

    submitBtn.addEventListener( "click", async ()=>{
        let newBlogs = {
            title: titleInput.value,
            author: authorInput.value,
            content: contentInput.value,
            image: imageInput.value,
            isItPublished: published.value
           }

           addDoc(colRef, newBlogs)
           allBlogs()
    })

            const allBlogs = async ()=>{
                const querysnapshot = await getDocs(colRef);
                console.log(querysnapshot);
                
                querysnapshot.forEach(doc => {
                    const data = {id: doc.id, ...doc.data()}
                    // let {age, gender:mygender, myName} = data
                    console.log(data);
                    
                    display.innerHTML += `
                        <div class="image-container">
                <img 
                    src="${data.image}" 
                    alt="${data.title}" 
                    class="img">
                    </div>
                    <div class="product-content">
                        <h1 class="card-title">
                            ${data.title}
                        </h1>
                        <h4 class="card-title">
                            ${data.author}
                        </h4>
                        <p class="description">
                            <span class="short">
                                ${data.content.substring(0, 100)}
                            </span>

                            <span 
                                class="long" 
                                style="display:none;"
                            >
                                ${data.content}
                            </span>
                        </p>
                    </div>
                    `
                })
            }

            allBlogs()
    </script>
    
</body>
</html>
