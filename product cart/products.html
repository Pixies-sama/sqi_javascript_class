<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"> -->
    <style>
        *{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            
        }
    body{
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        /* background-color: #0d13a8; */

    }
     .product-section {
        width: 90%;
        display: flex;
        flex-direction: column;
        padding-bottom: 60px;
    }
     .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
    }

    .section-header h2 {
        font-size: 22px;
        color: #111827;
    }

    .product-count {
        color: #6b7280;
        font-size: 14px;
    }
    .product-count {
        color: #6b7280;
        font-size: 14px;
    }
    #box {
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 15px;
    }
    .card {
         /* background-color: #4f46e5; */
        /* background-color: #0d13a8; */
        border: 1px solid #1c4eb2;
        border-radius: 16px;
        overflow: hidden;
        transition: 0.3s ease;
        display: flex;
        flex-direction: column;
    }

    .card:hover {
        transform: translateY(-6px);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
    }
    .product-image {
        width: 100%;
        height: 350px;
        background-color: #f8f9fe;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 25px;
    }
    .product-image img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        transition: 0.3s ease;
    }

    .card:hover .product-image img {
        transform: scale(1.05);
    }
    .card-body {
        padding: 20px;
        display: flex;
        flex-direction: column;
        flex: 1;
    }

    .category {
        font-size: 11px;
        color: #4f46e5;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.7px;
        margin-bottom: 8px;
    }

    .card-title {
        font-size: 16px;
        line-height: 1.4;
        color: #111827;
        margin-bottom: 10px;
        display: -webkit-box;
        --webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .card-text {
        color: #6b7280;
        font-size: 13px;
        line-height: 1.6;
    }

    .description {
        margin-bottom: 15px;
        display: -webkit-box;
        --webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .product-info {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: auto;
        padding-top: 15px;
        margin-bottom: 15px;
    }

    .price {
        font-size: 20px;
        font-weight: 800;
        color: #111827;
    }

    .rating {
        background-color: #fef3c7;
        color: #92400e;
        padding: 5px 9px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 700;
    }

    .product-button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 9px;
        background-color: #111827;
        color: white;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s ease;
        margin-bottom: 10px;
        margin-top: 10px;
    }
    .cart-button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 9px;
        background-color: #111827;
        color: white;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s ease;
        margin-bottom: 10px;
        margin-top: 10px;
    }

    .product-button:hover {
        background-color: #4f46e5;
    }
    .cart-button:hover {
        background-color: #4f46e5;
    }
    </style>
</head>
<body>
    
    <section class="product-section">
    <div class="section-header">
        <h2>All Products</h2>
        <span class="product-count">
            Explore our collection
        </span>
    </div>
    <div id="box">
    </div>
    
</section>
    <!-- <script src="product-details.html"></script> -->
    <script src="products.js"></script>
    <script src="product-details.js"></script>
    
</body>
</html>
