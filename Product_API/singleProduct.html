<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product Details</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }


        /* NAVIGATION */

        .navbar {
            background: #111;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        .navbar h2 {
            color: white;
        }


        .back-btn {
            background: white;
            color: #111;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
        }


        /* PRODUCT */

        #displayProduct {
            width: 90%;
            max-width: 1200px;
            margin: 60px auto;
        }


        .single-product {
            background: white;
            border-radius: 20px;
            padding: 35px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }


        .product-image {
            width: 100%;
            height: 500px;
            object-fit: cover;
            border-radius: 15px;
            background: #f2f2f2;
        }


        .product-details {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }


        .product-details h1 {
            font-size: 40px;
            margin-bottom: 15px;
            color: #111;
        }


        .category {
            display: inline-block;
            width: fit-content;
            background: #111;
            color: white;
            padding: 7px 15px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 20px;
        }


        .description {
            color: #666;
            line-height: 1.8;
            font-size: 16px;
            margin-bottom: 25px;
        }


        .price {
            font-size: 35px;
            font-weight: bold;
            margin-bottom: 10px;
        }


        .discount {
            color: #e63946;
            font-weight: bold;
            margin-bottom: 15px;
        }


        .rating {
            font-size: 17px;
            margin-bottom: 20px;
        }


        .info {
            border-top: 1px solid #eee;
            padding-top: 20px;
            margin-top: 10px;
        }


        .info p {
            margin-bottom: 12px;
            color: #555;
        }


        .info strong {
            color: #111;
        }


        .tags {
            margin-top: 10px;
            color: #777;
        }


        .cart-button {
            margin-top: 20px;
            background: #111;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }


        .cart-button:hover {
            background: #333;
        }


        /* MOBILE */

        @media (max-width: 800px) {

            .single-product {
                grid-template-columns: 1fr;
                padding: 20px;
            }


            .product-image {
                height: 350px;
            }


            .product-details h1 {
                font-size: 30px;
            }


            .price {
                font-size: 28px;
            }

        }

    </style>

</head>


<body>


    <nav class="navbar">

        <h2>My Store</h2>

        <a 
            href="./index.html" 
            class="back-btn"
        >
            ← Back to Products
        </a>

    </nav>


    <main id="displayProduct"></main>


    <script src="./singleProduct.js"></script>

</body>

</html>
