    <script>
        let currentTime = document.getElementById('currentTime');
        let currentDate = document.getElementById('currentDate');
        let hour =  document.getElementById('hours')
        let minute =  document.getElementById('minutes')
        let second =  document.getElementById('seconds')
        let result = document.getElementById('result')
        let song = document.getElementById('song')

        let date = new Date()
        date.toLocaleDateString()
        console.log(date.toLocaleDateString());

        let alarms = [];
        let alarmObj;
         
        
        function setAlarm() {

        
            alarmObj = {
            hour: hour.value,
            minute: minute.value,
            second: second.value
        }

            alarms.push(alarmObj)
            display()
            hour.value = "";
        minute.value = "";
        second.value = "";
        }

        
        let time =  setInterval(() => {
            let myDate = new Date();
            
            let hours = myDate.getHours();
            let minutes = myDate.getMinutes();
            let seconds = myDate.getSeconds();

            currentTime.innerHTML = `${hours} : ${minutes} : ${seconds} `
            currentDate.innerHTML = `Mon, Sep ${myDate.getDate()}, ${myDate.getFullYear()}`

              
            if (Number(alarmObj.hour) === hours && Number(alarmObj.minute) === minutes && Number(alarmObj.second) === seconds ) {
                song.loop = true;
                if (song.paused) {
                    song.play()
                }
            } else {
                
            }
        },1000);

        

        function display(){
            result.innerHTML = " "
            alarms.forEach((alarm, index, array) => {
                result.innerHTML += `
                <div class="panel alarm-status-panel" >
                    <div class="status-left">
                    <div class="status-icon">
                        <i class="fa-regular fa-clock"></i>
                    </div>
                    <div class="status-text">
                        <div class="label">Alarm Time</div>
                        <div class="time">${alarm.hour}:${alarm.minute}:${alarm.second} AM</div>
                    </div>
                </div>
                <div class="status-badge">Alarm set</div>
                </div>
            `
            });
        }

        
        function stopAlarm() {
            song.pause()
            song.currentTime = 0;
        }
