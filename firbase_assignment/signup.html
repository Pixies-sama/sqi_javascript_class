<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up page</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      .main {
        background: #f1f5f9;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .section {
        width: 100%;
        max-width: 440px;
      }
      .form_box {
        background: #ffffff;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
      }
      .form_box h2 {
        text-align: center;
        font-size: 28px;
        color: #111827;
        margin-bottom: 10px;
      }
      .form_box p {
        text-align: center;
        color: #6b7280;
        font-size: 14px;
        margin-bottom: 30px;
      }
      .inp_box {
        margin-bottom: 20px;
      }

      .inp_box label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #374151;
        margin-bottom: 8px;
      }

      .inp_box input {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #d1d5db;
        border-radius: 9px;
        font-size: 14px;
        outline: none;
        transition:
          border-color 0.3s,
          box-shadow 0.3s;
      }

      .inp_box input::placeholder {
        color: #9ca3af;
      }

      .inp_box input:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
      }

      .submit-btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 9px;
        background: #4f46e5;
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background 0.3s,
          transform 0.2s;
      }

      .submit-btn:hover {
        background: #4338ca;
        transform: translateY(-1px);
      }
      .divider {
        display: flex;
        align-items: center;
        gap: 15px;
        margin: 25px 0;
        color: #9ca3af;
        font-size: 12px;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #e5e7eb;
      }

      .google-btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 13px;
        border: 1px solid #d1d5db;
        border-radius: 9px;
        background: #ffffff;
        color: #374151;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background 0.3s,
          border-color 0.3s;
      }

      .google-btn img {
        width: 20px;
        height: 20px;
      }

      .google-btn:hover {
        background: #f9fafb;
        border-color: #9ca3af;
      }

      .footer-text {
        margin-top: 25px;
        text-align: center;
        font-size: 13px;
        color: #6b7280;
      }

      .footer-text a {
        color: #4f46e5;
        font-weight: 600;
        text-decoration: none;
      }

      .footer-text a:hover {
        text-decoration: underline;
      }

      @media (max-width: 480px) {
        .signup-form {
          padding: 25px 20px;
        }

        .signup-form h2 {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main class="main">
      <section class="section">
        <form class="form_box" id="signupForm">
          <h2>Create Account</h2>
          <p>Sign up to get started</p>
          <div class="inp_box">
            <label for="username">Username</label>
            <input
              type="text"
              placeholder="Enter your username"
              id="username"
              required
            />
          </div>

          <div class="inp_box">
            <label for="email">Email address</label>
            <input
              type="email"
              placeholder="Enter your email"
              id="email"
              required
            />
          </div>

          <div class="inp_box">
            <label for="password">Password</label>
            <input
              type="password"
              placeholder="Enter your username"
              id="password"
              required
              minlength="8"
            />
          </div>

          <button type="submit" class="submit-btn" id="createAccount">
            Create Account
          </button>

          <div class="divider">
            <span>OR</span>
          </div>

          <button type="button" class="google-btn" id="google">
            <img
              src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
              alt="Google logo"
            />
            Sign in with Google
          </button>

          <p class="footer-text">
            Already have an account?
            <a href="index.html">Sign in</a>
          </p>
        </form>
      </section>
    </main>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

      import {
        getFirestore,
        getDocs,
        doc,
        setDoc,
      } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

      import {
        getAuth,
        createUserWithEmailAndPassword,
        GoogleAuthProvider,
        signInWithPopup,
        sendEmailVerification,
        signOut,
      } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

      // Your web app's Firebase configuration
      const firebaseConfig = {
        apiKey: "AIzaSyARnmqtej61LLW2Cuz8RbMzWLuPDlnkBYs",
        authDomain: "authentication-2b3ab.firebaseapp.com",
        projectId: "authentication-2b3ab",
        storageBucket: "authentication-2b3ab.firebasestorage.app",
        messagingSenderId: "77468347822",
        appId: "1:77468347822:web:42b80889caf0a76dbfac3f",
      };

      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const provider = new GoogleAuthProvider();

      let username = document.getElementById("username");
      let email = document.getElementById("email");
      let password = document.getElementById("password");
      let createAccount = document.getElementById("createAccount");
      let google = document.getElementById("google");
      let signupForm = document.getElementById("signupForm");

      signupForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
          let user = {
            username: username.value.trim(),
            email: email.value.trim(),
            password: password.value,
          };
          let userCredential = await createUserWithEmailAndPassword(
            auth,
            user.email,
            user.password,
          );
          console.log(user);

          const uid = userCredential.user.uid;
          await setDoc(doc(db, "NewUsers", uid), {
            uid: uid,
            username: user.username,
            email: user.email,
          });

          const users = userCredential.user;
          await sendEmailVerification(users).then(() => {
            alert("Email link sent!");
          });

          await signOut(auth);
          // if (users.emailVerified) {
          //     alert("Login successful!");
          //     window.location.href = "dashboard.html";
          // } else {
          //     await signOut(auth);
          //     alert("Please verify your email before logging in.");
          // }
          alert("Account created successfully!");
          // signupForm.reset()
          window.location.href = "index.html";
        } catch (error) {
          console.error(error.code, error.message);

          if (error.code === "auth/email-already-in-use") {
            alert("An account with this email already exists.");
          } else if (error.code === "auth/invalid-email") {
            alert("Please enter a valid email address.");
          } else if (error.code === "auth/weak-password") {
            alert("Please choose a stronger password.");
          } else {
            alert("Something went wrong. Please try again.");
          }
        }
      });
      google.addEventListener("click", () => {
        signInWithPopup(auth, provider)
          .then((output) => {
            console.log(output);
          })
          .catch((error) => {
            console.log(error.message);
          });
      });
    </script>
  </body>
</html>
