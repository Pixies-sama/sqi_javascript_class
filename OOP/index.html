        // ===================== WEEK 8 CODE EXAMPLES =====================

// ===================== MONDAY: Introduction to OOP =====================

// Class Car
class Car {
    constructor(brand, color, speed, power) {
        this.brand = brand;
        this.color = color;
        this.speed = speed;
        this.power = power;
    }

    // Encapsulation
    canSpeed() {
        console.log(`${this.brand} can speed on ${this.speed}`);
    }
}

const carOne = new Car("Tesla", "Black", "1000km", "Solar");
const carTwo = new Car("Toyota", "White", "200km", "Petrol");

console.log(carOne);
console.log(carTwo);
carOne.canSpeed();
carTwo.canSpeed();

// Class Student
class Student {
    constructor(name, age, gender, status, complexion, matric) {
        this.name = name;
        this.age = age;
        this.gender = gender;
        this.status = status;
        this.complexion = complexion;
        this.matric = matric;
    }

    // Abstraction
    hasMatricNo() {
        console.log(`${this.name} has matric Number ${this.matric}`);
    }
}

// Inheritance
class JuniorStudent extends Student {
    constructor(name, age, gender, status, complexion, matric) {
        super(name, age, gender, status, complexion, matric);
    }

    hasMatricNo() {
        console.log(`${this.name} has matric Number ${this.matric}`);
    }
}

const studentOne = new Student("Hassan", 24, "male", "married", "dark", 12345);
const studentTwo = new Student("Hassan", 24, "male", "married", "dark", 425353636);
console.log(studentOne);
console.log(studentTwo);
studentOne.hasMatricNo();

// Classwork: Animal Class
class Animal {
    constructor(name, habitat, color, weight, sound) {
        this.name = name;
        this.habitat = habitat;
        this.color = color;
        this.weight = weight;
        this.sound = sound;
    }
}

const animalOne = new Animal("Lion", "Terrestial", "white", "100lb", "roar");
const animalTwo = new Animal("Cat", "House", "yellow", "20lb", "meow");
const animalThree = new Animal("Goat", "Terrestial", "Black", "100lb", "bleat");

console.log(animalOne);
console.log(animalTwo);
console.log(animalThree);

// ===================== TUESDAY: Encapsulation and Polymorphism =====================

// Encapsulation
class BankAccount {
    #balance = 0;
    constructor(name, age) {
        this.name = name;
        this.age = age;
    }

    deposit(amount) {
        console.log(`Your balance is $${this.#balance += amount}`);
    }

    withdraw(amount) {
        console.log(`Your balance is $${this.#balance -= amount}`);
    }
}

const user1 = new BankAccount();
user1.deposit(1000);
user1.deposit(1000);
user1.withdraw(1000);

// Polymorphism
class Human {
    constructor(name, age, gender) {
        this.name = name;
        this.age = age;
        this.gender = gender;
    }

    thinkingLevel() {
        console.log(`High level thinking`);
    }
}

class Lowperson extends Human {
    thinkingLevel() {
        console.log(`Intermediate level thinking`);
    }
}

const personOne = new Human("Tope", "12", "Male");
const personTwo = new Human("Joy", "82", "Female");

console.log(personOne);
console.log(personTwo);
personOne.thinkingLevel();

const personThree = new Lowperson("Tope", "12", "Male");
const personFour = new Lowperson("Joy", "82", "Female");

console.log(personThree);
console.log(personFour);
personThree.thinkingLevel();

// ===================== WEDNESDAY: Abstraction and Polymorphism =====================

// Abstraction with BankAccount
class BankAccount2 {
    #balance = 0;
    constructor(name, age) {
        this.name = name;
        this.age = age;
    }

    deposit(amount) {
        console.log(`Your balance is $${this.#balance += amount}`);
    }

    withdraw(amount) {
        console.log(`Your balance is $${this.#balance -= amount}`);
    }
}

const user2 = new BankAccount2();
user2.deposit(1000);
user2.deposit(1000);
user2.withdraw(1000);

// Polymorphism with Human and Lowperson
class Human2 {
    constructor(name, age, gender) {
        this.name = name;
        this.age = age;
        this.gender = gender;
    }

    thinkingLevel() {
        console.log(`High level thinking`);
    }
}

class Lowperson2 extends Human2 {
    thinkingLevel() {
        console.log(`Intermediate level thinking`);
    }
}

const personFive = new Human2("Tope", "12", "Male");
const personSix = new Human2("Joy", "82", "Female");

console.log(personFive);
console.log(personSix);
personFive.thinkingLevel();

const personSeven = new Lowperson2("Tope", "12", "Male");
const personEight = new Lowperson2("Joy", "82", "Female");

console.log(personSeven);
console.log(personEight);
personSeven.thinkingLevel();
