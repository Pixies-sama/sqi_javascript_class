    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.auth-container {
    width: 100%;
    max-width: 440px;
}

.signup-form {
    background: #ffffff;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
}

.signup-form h2 {
    text-align: center;
    font-size: 28px;
    color: #111827;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #6b7280;
    font-size: 14px;
    margin-bottom: 30px;
}

.input-group {
    margin-bottom: 20px;
}

.input-group label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 8px;
}

.input-group input {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
}

.input-group input::placeholder {
    color: #9ca3af;
}

.input-group input:focus {
    border-color: #4f46e5;
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
}

.submit-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: #4f46e5;
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
}

.submit-btn:hover {
    background: #4338ca;
    transform: translateY(-1px);
}

.divider {
    display: flex;
    align-items: center;
    gap: 15px;
    margin: 25px 0;
    color: #9ca3af;
    font-size: 12px;
}

.divider::before,
.divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #e5e7eb;
}

.google-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    background: #ffffff;
    color: #374151;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.3s, border-color 0.3s;
}

.google-btn img {
    width: 20px;
    height: 20px;
}

.google-btn:hover {
    background: #f9fafb;
    border-color: #9ca3af;
}

.footer-text {
    margin-top: 25px;
    text-align: center;
    font-size: 13px;
    color: #6b7280;
}

.footer-text a {
    color: #4f46e5;
    font-weight: 600;
    text-decoration: none;
}

.footer-text a:hover {
    text-decoration: underline;
}

@media (max-width: 480px) {
    .signup-form {
        padding: 25px 20px;
    }

    .signup-form h2 {
        font-size: 24px;
    }
}    
    </style>

<div class="auth-container">
    <form class="signup-form">
        <h2>Create Account</h2>
        <p class="subtitle">Sign up to get started</p>

        <div class="input-group">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                placeholder="Enter your username"
                required
            >
        </div>

        <div class="input-group">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required
                minlength="8"
            >
        </div>

        <button type="submit" class="submit-btn">
            Create Account
        </button>

        <div class="divider">
            <span>OR</span>
        </div>

        <button type="button" class="google-btn" id="google">
            <img
                src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                alt="Google logo"
            >
            Sign in with Google
        </button>

        <p class="footer-text">
            Already have an account?
            <a href="login.html">Sign in</a>
        </p>
    </form>
</div>

<div id="display"></div>
