<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }
        .main{
            width: 100%;
            height: 100vh;
            background-color: rgba(11, 11, 126, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .section{
            width: 40%;
            height: auto;
            background-color: rgb(80, 72, 72);
        }
        #input{
            width: 100%;
            height: 200px;
            font-size: 30px;
            padding-inline: 10px;
            
        }
        .bottom_container{
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            flex-wrap:wrap ;
            gap: 10px;
            padding: 10px 10px;
        }
        button{
            padding: 20px 35px 20px 35px;
            font-size: 30px;
            border: none;
            border-radius: 10px;
        }


        @media (max-width:425px) {
            .section{
            width: 90%;
            height: 50%;
            background-color: rgb(173, 22, 22);
        }
        }

    </style>
</head>
<body>
    <main class="main">
        <section class="section">
            <div class="top">
                <input type="text" placeholder="" id="input">
            </div>
            <div class="bottom">
                <div class="bottom_container">
                    <button type="button" id="">a</button>
                    <button type="button" id="">C</button>
                    <button type="button" id="">C</button>
                    <button type="button" id="">d</button>

                    <button type="button" id="">1</button>
                    <button type="button" id="">2</button>
                    <button type="button" id="">3</button>
                    <button type="button" id="">4</button>
                    <button type="button" id="">*</button>
                   
                    <button type="button" id="">8</button>
                    <button type="button" id="">7</button>
                    <button type="button" id="">6</button>
                    <button type="button" id="">5</button>
                    <button type="button" id="">-</button>

                    <button type="button" id="">%</button>
                    <button type="button" id="">1</button>
                    <button type="button" id="">2</button>
                    <button type="button" id="">3</button>
                    <button type="button" id="">4</button>

                    <button type="button" id="">*</button>
                </div>
            </div>
        </section>
    </main>
    
</body>
</html>
