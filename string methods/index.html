<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let greeting = " Hello";
        console.log(greeting.charAt(greeting.length -2 ));
        
        // lenght
        console.log(greeting.length);
        // touppercase
        console.log(greeting.toUpperCase());
        
        // tolowercase
        console.log(greeting.toLowerCase());

        // trim
        console.log(greeting.trim());

        // trimEnd
        console.log(greeting.trimEnd());

        // trimstart
        console.log(greeting.trimStart());

        // slice
        console.log(greeting.slice(1, 5));

        // replace
        console.log(greeting.replace("H" , "h"));

        // includes
        console.log(greeting.includes("l"));

        // indexOf
        console.log(greeting.indexOf("l"));

        // lastIndexOf
        console.log(greeting.lastIndexOf("l"));

        // charAt
        console.log(greeting.charAt(2));

        // repalceAll
        console.log(greeting.replaceAll("l" , "L"));

        // padstart
        let price = "1200";
        let user = "Omoloye Hassan";
    

        console.log(price.padStart(5 , "$"));
        console.log(price.padStart(5 , "$"));


        // split
        console.log(greeting.split(0, 5));

    </script>
</body>
</html>
