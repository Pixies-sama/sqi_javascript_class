<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>

    <h1>Welcome to Firebase</h1>
    <button id="signIn">Sign in with google</button>
    <div id="display"></div>

<script type="module">
    // Import the functions you need from the SDKs you need
            import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

            import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

            import { getAuth, GoogleAuthProvider,  signInWithPopup } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

           

            // Your web app's Firebase configuration
            const firebaseConfig = {
                apiKey: "AIzaSyDsQiD3pQat2KX9uRqXqw-Num6HHhUXvnA",
                authDomain: "hassan-blog-2d685.firebaseapp.com",
                projectId: "hassan-blog-2d685",
                storageBucket: "hassan-blog-2d685.firebasestorage.app",
                messagingSenderId: "513061618900",
                appId: "1:513061618900:web:b2d8247b62126c82932741"
            };

            // Initialize Firebase
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app)
            const provider = new GoogleAuthProvider();

            let signIn = document.getElementById('signIn');
            let display = document.getElementById('display');

            signIn.addEventListener("click", ()=>{
                signInWithPopup(auth, provider)

                .then((output)=>{
                    let user = output.user
                    display.innerHTML = `
                        <p>${user.uid}</p>
                        <h2>${user.displayName}</h2>
                        <img src="${user.photoURL}">
                    `
                    console.log(output);
                })
                .catch((error)=>{
                    console.log(error.message);
                    
                })

            })
            

</script>
</body>
</html>
