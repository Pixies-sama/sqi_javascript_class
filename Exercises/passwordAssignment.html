<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        *{
            background-color: brown;
        }
        .passContainer{
            position: relative;
        }
        #passInput{
        padding: 15px;
        width: 300px;
        padding-inline: 4px;
        border-radius: 10px;
        border: 1px solid grey;
        outline: none;
    }
    .fa-unlock-keyhole{
        display: none;
        position: absolute;
        right: 10px;
        left: 270px;
        top: 15px;
        cursor: pointer;
    }
    .fa-lock{
        display: block;
        position: absolute;
        right: 10px;
        left: 270px;
        top: 15px;
        cursor: pointer;
    }
    </style>
    
</head>
<body>
    <div class="passContainer">
    <input type="password" name="password input" id="passInput">
    <i class="fa-solid fa-lock" id="hidePass" onclick="pass()"></i>
    <i class="fa-solid fa-unlock-keyhole" id="passShow" onclick="pass()"></i>
    </div>
    

    <script>
    let showPass = document.getElementById('showPass')
    let hidePass = document.getElementById('hidePass')
    let passInput = document.getElementById('passInput')
    let unlock = document.getElementById('passShow');
    let lock = document.getElementById('hidePass')

    function pass() {
        if (passInput.type === 'password') {
            passInput.type = 'text';
            unlock.style.display = 'block';
            lock.style.display = 'none';
            console.log(passInput.value);  
        }else{
            passInput.type = 'password';
            lock.style.display = 'block';
            unlock.style.display = 'none';
            console.log(passInput.value);  
        }
        
    }

    </script>
</body>
</html>
